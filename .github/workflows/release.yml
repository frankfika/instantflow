name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build frontend
        run: npm run build
      - name: Type-check Worker
        run: npm run typecheck:worker
      - name: Run tests
        run: npm test
      - name: Dry-run deploy validation
        run: npm run deploy:dry-run

      # ── Archive dist for release ──────────────────────────────
      - name: Archive dist
        run: tar -czf dist-production.tar.gz -C dist .

      # ── Generate release notes ────────────────────────────────
      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..${{ github.ref_name }} --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          {
            echo "notes<<EOF"
            echo "## Changes"
            echo ""
            echo "$LOG"
            echo ""
            echo "---"
            echo "**Worker:** [instantflow](https://usend.xyz/)"
            echo "**Tag:** ${{ github.ref_name }}"
            echo ""
            echo "### Verification"
            echo "- [ ] Two-device text transfer succeeds"
            echo "- [ ] Two-device file transfer succeeds"
            echo "- [ ] Security codes match on both devices"
            echo "- [ ] Wrong pairing code is rejected"
            echo "- [ ] Completed transfer code cannot be reused"
            echo "- [ ] Sender revocation blocks download"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Create GitHub Release ─────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-production.tar.gz
