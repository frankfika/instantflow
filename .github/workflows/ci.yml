name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Build & lint ──────────────────────────────────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Build frontend
        run: npm run build
      - name: Type-check Worker
        run: npm run typecheck:worker
      - name: Verify production package (dry-run)
        run: npm run deploy:dry-run
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── Tests ─────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Build frontend for integration tests
        run: npm run build
      - name: Run unit & integration tests
        run: npm test

  # ── Security ──────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Audit all dependencies (high severity)
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Audit production dependencies (moderate severity)
        run: npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
