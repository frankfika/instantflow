name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Build & lint ──────────────────────────────────────────────
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Build frontend
        run: npm run build
      - name: Type-check Worker
        run: npm run typecheck:worker
      - name: Verify production package (dry-run)
        run: npm run deploy:dry-run
      - name: Upload dist artifact
        uses: actions/upload-artifact@6f9137f6c4d9c03d8c4f9e8d7be6d6c7f8c9d0e1 # v4.6.0
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── Tests ─────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Build frontend for integration tests
        run: npm run build
      - name: Run unit & integration tests
        run: npm test

  # ── Security ──────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Audit all dependencies (high severity)
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Audit production dependencies (moderate severity)
        run: npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
